services:
  postgres:
    image: postgres:16-alpine
    container_name: bastion-postgres
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: bastion
      POSTGRES_PASSWORD: bastion_dev
      POSTGRES_DB: bastion
    volumes:
      - bastion_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bastion -d bastion"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bastion_pg_data:
