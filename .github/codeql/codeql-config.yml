# Configuración de CodeQL para Bastion.
#
# js/insufficient-password-hash en src/lib/hibp.ts es un falso positivo:
# SHA-1 es obligatorio por el protocolo k-anonymity de Have I Been Pwned;
# no se almacena el hash (Argon2id en src/lib/argon2.ts).

name: Bastion CodeQL

query-filters:
  - exclude:
      problem:
        id: js/insufficient-password-hash
      path:
        - src/lib/hibp.ts
