name: CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DATABASE_URL: postgresql://bastion:bastion_ci@localhost:5432/bastion?schema=public
  AUTH_SECRET: ci-auth-secret-change-in-production-min-32-chars
  AUTH_URL: http://127.0.0.1:3000
  NEXTAUTH_URL: http://127.0.0.1:3000
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

jobs:
  quality:
    name: Lint, typecheck y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bastion
          POSTGRES_PASSWORD: bastion_ci
          POSTGRES_DB: bastion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bastion -d bastion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm exec prisma generate

      - name: Auditoría de dependencias (alta o crítica)
        run: pnpm audit --audit-level high

      - name: Migraciones de base de datos
        run: pnpm db:migrate

      - name: Seed de contenido
        run: pnpm db:seed

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright e2e y capturas
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bastion
          POSTGRES_PASSWORD: bastion_ci
          POSTGRES_DB: bastion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bastion -d bastion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm exec prisma generate

      - name: Auditoría de dependencias (alta o crítica)
        run: pnpm audit --audit-level high

      - name: Migraciones y seed
        run: pnpm db:migrate && pnpm db:seed

      - name: Build de producción
        run: pnpm build

      - name: Instalar navegadores Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Iniciar servidor
        run: BASTION_DISABLE_RATE_LIMIT=1 pnpm start &

      - name: Esperar servidor
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000 >/dev/null && exit 0
            sleep 2
          done
          echo "El servidor no respondió a tiempo"
          exit 1

      - name: Ejecutar e2e
        run: pnpm test:e2e

      - name: Subir capturas de pantalla
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bastion-screenshots
          path: artifacts/screenshots/
          if-no-files-found: warn
